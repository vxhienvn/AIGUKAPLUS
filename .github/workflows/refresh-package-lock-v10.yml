name: Refresh V10 package lock

on:
  push:
    branches:
      - audit/v10-runtime-cleanup-20260806
    paths:
      - package.json
      - .github/workflows/refresh-package-lock-v10.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v10-runtime-cleanup-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package lock for V10 runtime"
          git push origin HEAD:audit/v10-runtime-cleanup-20260806
