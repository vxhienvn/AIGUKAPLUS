name: Materialize final V10 AI worker

on:
  push:
    branches:
      - refactor/v10-final-ai-worker-20260806
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v10-final-ai-worker-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact production worker
        run: |
          tmp="$(mktemp -d)"
          cp v10-ai-worker-v2.js "$tmp/"
          cp \
            patch-v10-provider-load-balancer.js \
            patch-v10-provider-load-balancer-v4.js \
            patch-v10-provider-load-balancer-v5.js \
            patch-v10-provider-load-balancer-v6.js \
            patch-v10-decision-integrity-v3.js \
            patch-v10-decision-integrity-v4.js \
            patch-v10-decision-integrity-v5.js \
            patch-v10-decision-integrity-v6.js \
            patch-v10-decision-integrity-v7.js \
            patch-v10-decision-integrity-v8.js \
            patch-v10-decision-integrity-v9.js \
            "$tmp/"
          for patch in \
            patch-v10-provider-load-balancer.js \
            patch-v10-provider-load-balancer-v4.js \
            patch-v10-provider-load-balancer-v5.js \
            patch-v10-provider-load-balancer-v6.js \
            patch-v10-decision-integrity-v4.js \
            patch-v10-decision-integrity-v5.js \
            patch-v10-decision-integrity-v6.js \
            patch-v10-decision-integrity-v7.js \
            patch-v10-decision-integrity-v8.js \
            patch-v10-decision-integrity-v9.js
          do
            (cd "$tmp" && node "./$patch")
          done
          cp "$tmp/v10-ai-worker-v2.js" v10-ai-worker-final.js
          node --check v10-ai-worker-final.js
          grep -Fq 'providerSettings(provider).max_input_chars' v10-ai-worker-final.js
          grep -Fq 'AIGUKA_V10_DECISION_INTEGRITY_V9' v10-ai-worker-final.js
          grep -Fq 'v10_ai_quality_guard_v12' v10-ai-worker-final.js
          sha256sum v10-ai-worker-final.js | awk '{print $1}' > v10-ai-worker-final.sha256
      - name: Commit generated worker
        run: |
          if git diff --quiet -- v10-ai-worker-final.js v10-ai-worker-final.sha256; then
            echo "Final worker already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v10-ai-worker-final.js v10-ai-worker-final.sha256
          git commit -m "Materialize final V10 AI worker"
          git push origin HEAD:refactor/v10-final-ai-worker-20260806
