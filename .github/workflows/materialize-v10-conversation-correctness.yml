name: Materialize V10 conversation correctness

on:
  push:
    branches:
      - fix/v10-conversation-correctness-20260806

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v10-conversation-correctness-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize final AI and outbound workers
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp v10-ai-worker-v2.js "$tmp/"
          cp \
            patch-v10-provider-load-balancer.js \
            patch-v10-provider-load-balancer-v4.js \
            patch-v10-provider-load-balancer-v5.js \
            patch-v10-provider-load-balancer-v6.js \
            patch-v10-decision-integrity-v3.js \
            patch-v10-decision-integrity-v4.js \
            patch-v10-decision-integrity-v5.js \
            patch-v10-decision-integrity-v6.js \
            patch-v10-decision-integrity-v7.js \
            patch-v10-decision-integrity-v8.js \
            patch-v10-decision-integrity-v9.js \
            patch-v10-decision-integrity-v10.js \
            "$tmp/"
          for patch in \
            patch-v10-provider-load-balancer.js \
            patch-v10-provider-load-balancer-v4.js \
            patch-v10-provider-load-balancer-v5.js \
            patch-v10-provider-load-balancer-v6.js \
            patch-v10-decision-integrity-v4.js \
            patch-v10-decision-integrity-v5.js \
            patch-v10-decision-integrity-v6.js \
            patch-v10-decision-integrity-v7.js \
            patch-v10-decision-integrity-v8.js \
            patch-v10-decision-integrity-v9.js \
            patch-v10-decision-integrity-v10.js
          do
            (cd "$tmp" && node "./$patch")
          done
          cp "$tmp/v10-ai-worker-v2.js" v10-ai-worker-final.js
          sha256sum v10-ai-worker-final.js | awk '{print $1}' > v10-ai-worker-final.sha256

          node patch-v10-outbound-reply-order-v1.js

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "v10-ai-worker.js": [
                  ('worker_version: "v10_ai_quality_guard_v12"', 'worker_version: "v10_ai_quality_guard_v13"'),
              ],
              "v10-live-release.js": [
                  ('const VERSION = "v10_ai_quality_guard_v12";', 'const VERSION = "v10_ai_quality_guard_v13";'),
                  ('AIGUKA_V10_DECISION_INTEGRITY_V9', 'AIGUKA_V10_DECISION_INTEGRITY_V10'),
                  ('requireToken("v10-outbound-worker.js", \'const VERSION = "v10_outbound_safety_only_v1";\');', 'requireToken("v10-outbound-worker.js", \'const VERSION = "v10_outbound_safety_only_v1";\');\nrequireToken("v10-outbound-worker.js", "AIGUKA_V10_OUTBOUND_REPLY_ORDER_V1");'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"missing replacement target in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          node --check v10-ai-worker-final.js
          node --check v10-outbound-worker.js
          node --check v10-live-release.js
          node --test tests/v10-conversation-correctness.test.js

      - name: Commit materialized artifacts
        run: |
          if git diff --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v10-ai-worker-final.js v10-ai-worker-final.sha256 v10-outbound-worker.js v10-ai-worker.js v10-live-release.js
          git commit -m "Materialize V10 conversation correctness guards"
          git push origin HEAD:fix/v10-conversation-correctness-20260806
